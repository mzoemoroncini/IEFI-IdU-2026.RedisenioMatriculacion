name: Verificar Aula
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar reglas y persistencia SQLite
        run: node --test tests/*.test.mjs
      - name: Verificar JavaScript del navegador
        run: |
          node --check public/app.js
          node --check public/rules.js
